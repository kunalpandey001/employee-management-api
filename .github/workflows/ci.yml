name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: employee_user
          POSTGRES_PASSWORD: employee_pass
          POSTGRES_DB: employee_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U employee_user -d employee_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://employee_user:employee_pass@localhost:5432/employee_test_db
        run: |
          alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql://employee_user:employee_pass@localhost:5432/employee_test_db
        run: |
          pytest